name: Publish portfolio from site.zip

on:
  push:
    branches: [main]
    paths:
      - 'site.zip'
      - '.github/workflows/deploy.yml'
      - 'scripts/patch_contact.py'
      - 'scripts/patch_portfolio_shop.py'
      - 'scripts/patch_swiss_alpine.py'
      - 'scripts/patch_product_repair.py'
      - 'scripts/patch_showcase_cards.py'
      - 'scripts/patch_kindle_links.py'
      - 'scripts/patch_published_books.py'
      - 'assets/css/portfolio-v2.css'
      - 'assets/images/avatar-guney-clean.webp.b64'
      - 'scripts/patch_social_accounts.py'
      - 'assets/images/avatar-personal-2026.webp.b64'
      - 'assets/images/avatar-creator-2026.webp.b64'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v4

      - name: Extract exact site release
        run: |
          set -euo pipefail
          mkdir -p _site
          unzip -q site.zip -d _site
          test -s _site/index.html
          test -s _site/tr/index.html
          test -s _site/assets/css/site.css
          test -s _site/assets/previews/awooo-chronicles-preview.pdf
          test -s _site/assets/previews/awooo-the-tale-of-a-husky-preview.pdf
          echo "Files ready for publishing:"
          find _site -type f | wc -l

      - name: Insert bilingual email contacts
        run: python3 scripts/patch_contact.py _site

      - name: Apply approved bilingual Books, Apps and Shop design
        run: python3 scripts/patch_portfolio_shop.py _site

      - name: Validate new home and Shop pages
        run: |
          test -s _site/shop/index.html
          test -s _site/tr/shop/index.html
          test -s _site/assets/css/portfolio-v2.css
          grep -q 'portfolio-shop-grid' _site/index.html
          grep -q 'portfolio-shop-grid' _site/tr/index.html
          grep -q 'app-symbol gentian' _site/index.html
          grep -q 'app-symbol rotam' _site/tr/index.html

      - name: Rebrand Swiss Alpine Routes across bilingual portfolio
        run: python3 scripts/patch_swiss_alpine.py _site

      - name: Repair app covers and Kindle-only book sections
        run: |
          python3 scripts/patch_product_repair.py _site
          test -s _site/assets/images/gentian-cover.webp
          test -s _site/assets/images/swiss-alpine-cover.webp
          ! grep -R -q 'Apple Books' _site/books _site/tr/books

      - name: Align app cards with approved logo-first design
        run: |
          python3 scripts/patch_showcase_cards.py _site
          test -s _site/assets/css/showcase-cards.css
          grep -q 'class="showcase-heading"' _site/shop/index.html
          grep -q 'class="showcase-heading"' _site/tr/shop/index.html
          grep -q 'class="showcase-heading"' _site/apps/index.html
          grep -q 'class="showcase-heading"' _site/tr/apps/index.html
          grep -q '.shop-section#apps .shop-product-grid{grid-template-columns:minmax(0,1fr)}' _site/assets/css/showcase-cards.css
          grep -q '.showcase-heading img.showcase-logo' _site/assets/css/showcase-cards.css

      - name: Add published Kindle marketplaces and book CTAs
        run: |
          python3 scripts/patch_kindle_links.py _site
          test -s _site/assets/css/kindle-stores.css
          test -s _site/assets/css/book-actions.css
          grep -q 'href="../books/awooo-the-tale-of-a-husky/#amazon-stores">Buy ↗' _site/shop/index.html
          grep -q 'href="../books/awooo-the-tale-of-a-husky/#amazon-stores">Satın Al ↗' _site/tr/shop/index.html
          grep -q 'class="shop-book-actions"' _site/shop/index.html
          grep -q 'class="shop-book-actions"' _site/tr/shop/index.html
          grep -q 'href="../assets/previews/awooo-the-tale-of-a-husky-preview.pdf"' _site/shop/index.html
          grep -q 'href="../../assets/previews/awooo-the-tale-of-a-husky-preview.pdf"' _site/tr/shop/index.html
          grep -q 'book-actions.css?v=20261123c' _site/shop/index.html
          grep -q 'book-actions.css?v=20261123c' _site/tr/shop/index.html
          grep -q 'id="amazon-stores"' _site/books/awooo-the-tale-of-a-husky/index.html
          grep -q 'id="amazon-stores"' _site/tr/books/awooo-the-tale-of-a-husky/index.html
          grep -q 'https://www.amazon.com/dp/B0HSMDXKWG' _site/books/awooo-the-tale-of-a-husky/index.html
          grep -q 'https://www.amazon.de/dp/B0HSMDXKWG' _site/tr/books/awooo-the-tale-of-a-husky/index.html

      - name: Publish both AWOOO books with Preview landing pages
        run: |
          python3 scripts/patch_published_books.py _site
          grep -q 'id="amazon-stores"' _site/books/awooo-chronicles/index.html
          grep -q 'id="amazon-stores"' _site/tr/books/awooo-chronicles/index.html
          grep -q 'https://www.amazon.com/s?k=' _site/books/awooo-chronicles/index.html
          grep -q 'class="shop-book-actions"' _site/shop/index.html
          grep -q 'class="shop-book-actions"' _site/tr/shop/index.html
          grep -q 'href="../books/awooo-chronicles/#amazon-stores"' _site/shop/index.html
          grep -q 'href="../books/awooo-chronicles/"' _site/shop/index.html
          grep -q 'href="../books/awooo-the-tale-of-a-husky/"' _site/shop/index.html
          grep -q 'href="../books/awooo-chronicles/#amazon-stores"' _site/tr/shop/index.html
          grep -q 'href="../books/awooo-the-tale-of-a-husky/"' _site/tr/shop/index.html
          ! grep -q 'awooo-the-tale-of-a-husky-preview.pdf' _site/shop/index.html
          ! grep -q 'awooo-the-tale-of-a-husky-preview.pdf' _site/tr/shop/index.html

      - name: Replace Güney portrait with clean original
        run: |
          set -euo pipefail
          base64 -d assets/images/avatar-guney-clean.webp.b64 > _site/assets/images/avatar-guney.webp
          echo "0fcc7f4f4d4d4ff3bced6855d8086d436bf9a7bec71acae4f7637ce5be6fdca6  _site/assets/images/avatar-guney.webp" | sha256sum --check
          find _site -name index.html -type f -print0 | xargs -0 -r sed -i 's|avatar-guney.webp"|avatar-guney.webp?v=20261121-clean"|g'
          grep -q 'avatar-guney.webp?v=20261121-clean' _site/index.html
          grep -q 'avatar-guney.webp?v=20261121-clean' _site/tr/index.html
          grep -q 'avatar-guney.webp?v=20261121-clean' _site/visual-stories/index.html
          grep -q 'avatar-guney.webp?v=20261121-clean' _site/tr/visual-stories/index.html

      - name: Publish updated personal and creator Instagram profiles
        run: |
          python3 scripts/patch_social_accounts.py _site
          test -s _site/assets/images/avatar-personal-2026.webp
          test -s _site/assets/images/avatar-creator-2026.webp
          grep -q 'instagram.com/bulentcreates/' _site/index.html
          grep -q 'instagram.com/bulentcreates/' _site/tr/index.html
          grep -q 'instagram.com/bulentcreates/' _site/contact/index.html
          grep -q 'instagram.com/bulentcreates/' _site/tr/contact/index.html
          grep -q 'instagram-2026-layout' _site/index.html
          grep -q 'instagram-2026-layout' _site/tr/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Allow Pages artifact metadata to settle
        run: sleep 8

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
